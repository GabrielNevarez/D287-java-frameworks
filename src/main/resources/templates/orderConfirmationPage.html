<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Confirmation – Aztlan Technologies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h1 class="text-center text-primary">Purchase Confirmation</h1>
  <hr>

  <p class="lead">
    <strong>Order Status:</strong>
  </p>
  <div th:if="${message}" class="alert alert-info text-center fw-bold" th:text="${message}">Message goes here</div>


  <div class="text-center mt-4">
    <a href="/" class="btn btn-outline-primary">← Back to Main Screen</a>
  </div>
</div>

</body>
</html>
